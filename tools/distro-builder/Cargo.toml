[package]
name = "distro-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side validator and future Arch rootfs/ISO builder"

[features]
# Test builds only: SIGKILL the slot tool at the point named by
# FLOWERLY_SLOT_FAULT, for real power-loss runs. Never enabled by default.
fault-injection = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tempfile = "3"
