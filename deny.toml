# Cargo deny configuration.
#
# Policy: prefer fewer, maintained dependencies. Licenses must be compatible
# with a GPL-3.0-or-later project. The advisory check is reported but not
# fatal in CI until the dependency set stabilizes.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[bans]
multiple-versions = "warn"
# Workspace-internal crates are intentionally versionless path dependencies,
# which cargo-deny classes as wildcards; warn instead of fail.
wildcards = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Apache-2.0 WITH LLVM-exception",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]