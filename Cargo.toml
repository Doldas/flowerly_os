[workspace]
resolver = "2"
members = [
    "src/flowerlyd",
    "src/evolutiond",
    "src/providerd",
    "src/shared/flowerly-core",
    "tools/agenticctl",
    "tools/distro-builder",
    "testbed/integration",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Doldas/flowerly_os"
homepage = "https://github.com/Doldas/flowerly_os"
authors = ["Flowerly OS Contributors"]
description = "Flowerly OS — a self-evolving Linux distribution built around autonomous agents as first-class system actors."

[workspace.dependencies]
flowerly-core = { path = "src/shared/flowerly-core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
