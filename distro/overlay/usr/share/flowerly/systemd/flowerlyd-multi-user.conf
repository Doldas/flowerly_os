# Opt-in multi-user access for flowerlyd (#225). NOT active as shipped:
# flowerlyd stays service-account-only until an administrator installs this
# file as a drop-in.
#
# Enable:
#   install -D -m 0644 /usr/share/flowerly/systemd/flowerlyd-multi-user.conf \
#       /etc/systemd/system/flowerlyd.service.d/50-multi-user.conf
#   systemctl daemon-reload && systemctl restart flowerlyd
# Disable (rollback to service-account-only):
#   rm /etc/systemd/system/flowerlyd.service.d/50-multi-user.conf
#   systemctl daemon-reload && systemctl restart flowerlyd
#
# Members of flowerly-users may then connect and run User commands on their
# own data only (per-uid ownership). Admin commands additionally require
# flowerly-admin; PTY commands stay limited to the flowerly service account.
# Never add the flowerly account to flowerly-admin.
[Service]
# Primary group: flowerlyd creates its socket group flowerly-users, mode 0660,
# and systemd creates /run/flowerly group flowerly-users, mode 0750. The state
# directory stays 0700 and state.db 0600 (UMask=0077): private to flowerly.
Group=flowerly-users
RuntimeDirectoryMode=0750
# The base unit unsets AGENTIC_USERS_GROUP so the service manager cannot
# inject it. Reset that list, keep AGENTIC_CONFIG and AGENTIC_DATABASE_PATH
# unset (#237), and set the users group from this file only: Environment=
# also overrides any manager value.
UnsetEnvironment=
UnsetEnvironment=AGENTIC_CONFIG AGENTIC_DATABASE_PATH
Environment=AGENTIC_USERS_GROUP=flowerly-users
