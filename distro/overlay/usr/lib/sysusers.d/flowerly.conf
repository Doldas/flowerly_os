# System accounts created by systemd-sysusers at boot.
u flowerly - "Flowerly OS supervisor" /var/lib/flowerly
u flowerly-evolution - "Flowerly Evolution boundary" /var/lib/flowerly-evolution
# IPC access groups (#31). flowerly-admin membership is required for every
# Admin command. flowerly-users admission is an administrator opt-in (#225):
# /usr/share/flowerly/systemd/flowerlyd-multi-user.conf. Never add the
# flowerly service account to flowerly-admin (no `m flowerly ...` line): it
# runs PTY shells and owns state.db.
g flowerly-users -
g flowerly-admin -
