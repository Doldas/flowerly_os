# /etc/systemd/system/flowerlyd.service.d/60-remote-inference.conf
# NOT installed by default. Lets flowerlyd reach provider sockets and read
# the administrator's gate policy; prompts still need profile opt-in and
# per-user consent (ADR-0022).
[Service]
SupplementaryGroups=flowerly-provider-clients
ExecStart=
ExecStart=/usr/bin/flowerlyd --state-dir /var/lib/flowerly --remote-providers /etc/flowerly/remote-providers.toml
