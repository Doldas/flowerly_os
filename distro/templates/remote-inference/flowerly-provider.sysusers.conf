# Remote inference provider account (ADR-0022, owner Q1). It cannot read
# /var/lib/flowerly (0700 flowerly) and holds no other credential.
g flowerly-provider-clients -
u flowerly-provider - "Flowerly OS remote inference provider" - -
# flowerlyd reaches the provider socket (0660, this group) and nothing else.
m flowerly flowerly-provider-clients
