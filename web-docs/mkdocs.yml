site_name: Flowerly OS
site_description: Documentation, help, architecture, releases and roadmap for Flowerly OS
site_url: https://doldas.github.io/flowerly_os/
repo_url: https://github.com/Doldas/flowerly_os
repo_name: Doldas/flowerly_os
edit_uri: edit/master/web-docs/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Online Help:
      - Help Center: help/index.md
      - Getting Started: help/getting-started.md
      - Flows: help/flows.md
      - Troubleshooting: help/troubleshooting.md
  - Wiki:
      - Wiki Home: wiki/index.md
      - Vision: vision.md
      - Architecture: architecture.md
      - System Design: system-design.md
      - Image & Userspace Model: image-model.md
      - Flow Model: flow-model.md
      - Session Model: session-model.md
      - Goal Model: goal-model.md
      - Generations: generations.md
      - Evolution: evolution.md
      - Provenance: provenance.md
      - Capabilities: capabilities.md
      - Command Authorization: command-authorization.md
      - Compute Catalog: compute-catalog.md
      - Compute Profiles: compute-profiles.md
      - Compute Scheduling: compute-scheduling.md
      - Compute Inference: compute-inference.md
      - Remote Inference Operations: remote-inference-operations.md
      - Remote Provider Unit Test Plan: remote-provider-unit-test-plan.md
      - IPC v1 Typed Arguments: ipc-v1-typed-arguments.md
      - User Model: user-model.md
      - Threat Model: threat-model.md
      - Language Policy: language-policy.md
      - Decisions: decisions.md
      - Engineering Journal: journal.md
      - ADRs: adr/index.md
      - RFCs: rfcs/index.md
  - Project:
      - Project Overview: project/index.md
      - Roadmap: roadmap.md
      - Review Implementation Plan: review-implementation-plan-2026-10-12.md
      - 0.0.4 Completion Plan: release-0.0.4-completion-plan.md
      - Releases: releases.md
      - Build Guide: build.md
  - Contributing: contributing.md
