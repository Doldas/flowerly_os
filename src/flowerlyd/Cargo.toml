[package]
name = "flowerlyd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single Flowerly OS supervisor for user-state modules"

[features]
# Test images only (ADR-0023 G5): one extra migration that raises min_reader
# past every released binary, for the real downgrade drill. Never in a release.
g5-schema-drill = ["flowerly-core/g5-schema-drill"]

[dependencies]
flowerly-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tempfile = "3"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rusqlite.workspace = true
