[package]
name = "providerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Flowerly OS inference provider: synthetic echo reference backend and opt-in OpenAI-compatible backend (fault-isolated, fail-closed)"

[dependencies]
anyhow.workspace = true
clap.workspace = true
flowerly-core = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid.workspace = true
serde.workspace = true
toml.workspace = true
sha2 = "0.10"
# HTTPS for the opt-in OpenAI-compatible backend (ADR-0022).
# rustls with the ring provider and the system trust store only: no aws-lc
# (its sys crate carries the OpenSSL licence), no bundled webpki roots
# (CDLA), no system proxy, no cookies, no decompression, HTTP/1.1 only.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing-subscriber.workspace = true
tempfile = "3"
