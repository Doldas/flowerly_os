site_name: Flowerly OS
site_description: Documentation, help, architecture, releases and roadmap for Flowerly OS
site_url: https://doldas.github.io/flowerly_os/
repo_url: https://github.com/Doldas/flowerly_os
repo_name: Doldas/flowerly_os
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Online Help:
      - Help Center: help/index.md
      - Getting Started: help/getting-started.md
      - Flows: help/flows.md
      - Troubleshooting: help/troubleshooting.md
  - Wiki:
      - Wiki Home: wiki/index.md
      - Vision: vision.md
      - Architecture: architecture.md
      - System Design: system-design.md
      - Flow Model: flow-model.md
      - Session Model: session-model.md
      - Goal Model: goal-model.md
      - Generations: generations.md
      - Evolution: evolution.md
      - Provenance: provenance.md
      - Capabilities: capabilities.md
      - User Model: user-model.md
      - Threat Model: threat-model.md
      - Language Policy: language-policy.md
      - Decisions: decisions.md
      - Engineering Journal: journal.md
      - ADRs: adr/index.md
  - Project:
      - Project Overview: project/index.md
      - Roadmap: roadmap.md
      - Releases: releases.md
      - Build Guide: build.md
  - Contributing: contributing.md
