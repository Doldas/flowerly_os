name: ci

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLOWERLY_CACHE_VERSION: v1

jobs:
  rust:
    name: rust
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'flowerly-runner' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.FLOWERLY_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ env.FLOWERLY_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Format check
        run: just fmt-check

      - name: Clippy (warnings as errors)
        run: just lint

      - name: Compile check
        run: just check

      - name: Test
        run: just test

      - name: Release build
        run: just build

      - name: Run daemon self-tests
        run: bash ./scripts/check-daemon-self-tests.sh target/release

      - name: Check CLI-to-daemon contracts
        run: bash ./scripts/check-cli-contracts.sh target/release

      - name: Black-box external SQLite writer contention across daemons
        run: python3 ./scripts/test-sqlite-ipc-contention.py target/release

      - name: Black-box durable IPC operation-key replay and restart
        run: python3 ./scripts/test-ipc-idempotency.py target/release

      - name: Check development runtime ownership isolation
        run: bash ./scripts/test-dev-runtime-ownership.sh

      - name: Experimental Linux PTY ownership spike
        run: python3 ./scripts/pty-process-spike.py

      - name: Experimental independent PTY supervisor reconnect
        run: python3 ./scripts/pty-supervisor-spike.py

      - name: Linux PTY guardian black-box ownership regression
        run: python3 ./scripts/test-pty-guardian.py

      - name: Production PTY cgroup isolation and delegated containment
        run: python3 ./scripts/test-pty-cgroup.py

      - name: Flow A to B to A real sessiond PTY acceptance
        run: python3 ./scripts/test-sessiond-pty-flow.py target/release
      - name: Release PTY kernel cgroup and escaped descendant acceptance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: bash ./scripts/arch-pty-cgroup-acceptance.sh

  docs:
    name: docs
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'flowerly-runner' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Validate mandatory release-branch gate definitions
        run: |
          python3 scripts/release-gates.py validate
          python3 scripts/test-release-gates.py

      - name: Check required documentation
        run: ./scripts/check-docs.sh

      - name: Check Arch image inputs
        run: bash ./scripts/check-image-inputs.sh

      - name: Check Arch VM test scripts
        run: |
          bash -n ./scripts/arch-kernel-vm-test.sh
          bash -n ./tests/arch-kernel/guest-verify.sh
          bash -n ./scripts/arch-pty-cgroup-acceptance.sh

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            "*.md"
            "docs/**/*.md"
            "docs/adr/**/*.md"
            "docs/rfcs/**/*.md"
            "image/**/*.md"

      - name: Check documentation build references
        run: |
          for f in README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md; do
            [ -s "$f" ] || { echo "missing or empty $f"; exit 1; }
          done