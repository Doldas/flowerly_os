name: ci

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLOWERLY_CACHE_VERSION: v1

jobs:
  rust:
    name: rust
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'flowerly-runner' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure all workflow actions are immutable SHA-pinned
        run: python3 scripts/test-workflow-action-pins.py

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.FLOWERLY_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ env.FLOWERLY_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Format check
        run: just fmt-check

      - name: Clippy (warnings as errors)
        run: just lint

      - name: Compile check
        run: just check

      - name: Test
        run: just test

      - name: Release build
        run: just build

      - name: Run daemon self-tests
        run: bash ./scripts/check-daemon-self-tests.sh target/release

      - name: Check CLI-to-daemon contracts
        run: bash ./scripts/check-cli-contracts.sh target/release

      - name: Black-box unified runtime, durable replay and separate hypervisor boundary
        run: python3 ./testbed/integration/test-unified-runtime.py target/release

      - name: Multi-domain durable IPC operation-key replay and restart
        run: python3 ./scripts/test-ipc-idempotency.py target/release

      - name: External SQLite writer contention across unified modules
        run: python3 ./scripts/test-sqlite-ipc-contention.py target/release

      - name: Verify delegated management cgroup writes the real supervisor PID
        run: bash ./scripts/arch-pty-cgroup-acceptance.sh --verify-management-pid

      - name: Session daemon remains available without PTY cgroup delegation
        run: python3 ./scripts/test-sessiond-pty-unavailable.py target/release

      - name: Local model catalog honest evidence and replay contract
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-compute-catalog.py target/release

      - name: CLI local model catalog lifecycle and device-budget contract
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-cli-compute.py target/release

      - name: Expert profiles credential-free versioning and fail-closed provider boundary
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-compute-profiles.py target/release

      - name: Workload admission honesty and usage ledger durability
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-compute-scheduling.py target/release

      - name: Reference provider execution, outage consent and replay safety
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-compute-inference.py target/release

      - name: Compute error-code surface is machine-readable
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-compute-error-codes.py target/release


      - name: Check development runtime ownership isolation
        run: bash ./scripts/test-dev-runtime-ownership.sh

      - name: Experimental Linux PTY ownership spike
        run: python3 ./scripts/pty-process-spike.py

      - name: Experimental independent PTY supervisor reconnect
        run: python3 ./scripts/pty-supervisor-spike.py

      - name: Verify runner UID and prepare dedicated unprivileged PTY account
        run: |
          id
          id -u
          bash ./scripts/ci-pty-user.sh prepare

      - name: Root-owned PTY shell startup is refused
        run: bash ./scripts/ci-pty-user.sh root-refusal

      - name: Linux PTY guardian black-box ownership regression
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-pty-guardian.py

      - name: Production PTY cgroup isolation and delegated containment
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-pty-cgroup.py

      - name: Flow A to B to A real unified PTY acceptance
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-sessiond-pty-flow.py target/release

      - name: Durable PTY spawn reservation, concurrent retry and restart lookup
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-pty-supervisor-integration.py

      - name: PTY independent followers, backpressure, disconnect and abrupt sessiond death
        run: bash ./scripts/ci-pty-user.sh run python3 ./scripts/test-pty-adversarial.py target/release

      - name: Prepare trusted Arch VM host for real delegated PTY acceptance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: bash ./scripts/prepare-arch-vm-host.sh

      - name: Release PTY kernel cgroup, escaped descendant and Arch guest acceptance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        timeout-minutes: 90
        env:
          FLOWERLY_TEST_REF: ${{ github.ref_name }}
          FLOWERLY_TEST_SHA: ${{ github.sha }}
          FLOWERLY_TEST_SLUG: release-push
        run: bash ./scripts/arch-kernel-vm-test.sh

      - name: Preserve exact-SHA Arch guest and failed kernel acceptance evidence
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arch-release-pty-${{ github.sha }}
          path: target/arch-kernel/release-push/report/
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: docs
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'flowerly-runner' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Self-hosted release runners may use distro-managed Python (PEP 668).
      # Select a Python with venv support; the builder installs into a venv.
      - name: Setup Python for documentation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: web-docs/requirements-docs.txt

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: just

      - name: Validate mandatory release-branch gate definitions
        run: |
          python3 scripts/release-gates.py validate
          python3 scripts/test-release-gates.py

      - name: Check required documentation
        run: ./scripts/check-docs.sh

      - name: Verify runtime topology and provider separation (#105)
        run: python3 scripts/test-runtime-topology.py

      - name: Reject new raw Linux and SQLite imports in core domains (#91)
        run: python3 scripts/test-layer-15-boundaries.py

      - name: Test protected release forwarding (offline)
        run: python3 scripts/test-branch-forward.py

      - name: Build documentation and verify GitHub Pages output
        run: bash ./scripts/build-docs-site.sh

      - name: Verify Make and just task parity and documentation paths
        run: python3 ./scripts/test-build-task-parity.py

      - name: Check Arch image inputs
        run: bash ./scripts/check-image-inputs.sh

      - name: Verify Arch rootfs build contract offline
        run: python3 ./scripts/test-build-arch-rootfs.py

      - name: Verify Flowerly rootfs installation offline
        run: python3 ./scripts/test-install-flowerly-rootfs.py

      - name: Verify Arch boot preparation offline
        run: python3 ./scripts/test-prepare-arch-boot.py

      - name: Verify Flowerly boot IPC witness offline
        run: python3 ./scripts/test-boot-ipc-health.py

      - name: Verify populated ext4 image creation offline
        run: python3 ./scripts/test-build-arch-root-volume.py

      - name: Verify direct QEMU boot probe offline
        run: python3 ./scripts/test-probe-arch-qemu-boot.py

      - name: Verify mkosi initramfs staging offline
        run: python3 ./scripts/test-build-arch-initrd.py

      - name: Check Arch VM test scripts
        run: |
          bash -n ./scripts/arch-kernel-vm-test.sh
          bash -n ./scripts/lib/arch-vm-disk.sh
          bash -n ./scripts/arch-vm-guest-disk-preflight.sh
          bash -n ./scripts/test-arch-vm-disk.sh
          bash -n ./testbed/evolution-world/arch-kernel/guest-verify.sh
          bash -n ./scripts/arch-pty-cgroup-acceptance.sh

      - name: Arch VM sparse disk growth and guest preflight regression
        run: bash ./scripts/test-arch-vm-disk.sh

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: |
            "*.md"
            "web-docs/docs/**/*.md"
            "web-docs/docs/adr/**/*.md"
            "web-docs/docs/rfcs/**/*.md"
            "distro/**/*.md"

      - name: Check documentation build references
        run: |
          for f in README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md; do
            [ -s "$f" ] || { echo "missing or empty $f"; exit 1; }
          done