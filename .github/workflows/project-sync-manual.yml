name: Project sync (manual)

# Kept separate from project-sync.yml (workflow_dispatch only). Least
# privilege (#187): GITHUB_TOKEN only reads; writing to the user-owned
# Project needs the FLOWERLY_PROJECT_TOKEN secret (PAT with 'project' scope).
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  reconcile-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sync issues and PRs with project fields
        env:
          GH_TOKEN: ${{ secrets.FLOWERLY_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-project.py
