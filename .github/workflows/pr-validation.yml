name: pr-validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master, 'release/**']

permissions:
  contents: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-policy:
    name: Validate branch policy and issue link
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata as data
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const head = pr.head.ref;
            const base = pr.base.ref;
            const body = pr.body || "";

            const developmentHead = /^(feature|bugfix|docs)\/.+/;
            const releaseBranch = /^release\/\d+$/;

            if (base === "master") {
              if (!releaseBranch.test(head)) {
                core.setFailed(
                  `PRs to master must originate from release/N; got ${head} -> ${base}`
                );
                return;
              }
            } else if (releaseBranch.test(base)) {
              if (!developmentHead.test(head)) {
                core.setFailed(
                  `PRs to ${base} must originate from feature/*, bugfix/* or docs/*; got ${head}`
                );
                return;
              }
            } else {
              core.setFailed(
                `Unsupported PR base ${base}; expected master or release/N`
              );
              return;
            }

            const issueNumbers = [
              ...new Set(
                [...body.matchAll(/#(\d+)/g)].map((match) => Number(match[1]))
              ),
            ];

            if (issueNumbers.length === 0) {
              core.setFailed(
                "PR description must reference an issue (for example: Fixes #123)"
              );
              return;
            }

            for (const issue_number of issueNumbers) {
              try {
                await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                });
                core.info(`Issue #${issue_number} exists`);
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`Referenced issue #${issue_number} does not exist`);
                  return;
                }
                throw error;
              }
            }

            core.info(`Accepted branch policy: ${head} -> ${base}`);
