name: pr-validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [master, 'release/**']

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-policy:
    name: Validate branch policy and issue link
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata as data
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const head = pr.head.ref;
            const base = pr.base.ref;
            const body = pr.body || "";

            const developmentHead = /^(feature|bugfix|docs)\/.+/;
            const releaseBranch = /^release\/([1-9]\d*)$/;

            // Skip full validation for release->master promotion PRs
            const isPromotion = base === "master" && releaseBranch.test(head);
            if (isPromotion) {
              core.info(`Release promotion PR ${head} -> ${base}, skipping issue-link requirement`);
              return;
            }

            if (base === "master") {
              if (!releaseBranch.test(head)) {
                core.setFailed(
                  `PRs to master must originate from release/N; got ${head} -> ${base}`
                );
                return;
              }
            } else if (releaseBranch.test(base)) {
              const from = head.match(releaseBranch);
              const to = base.match(releaseBranch);
              const adjacent = from && to &&
                BigInt(from[1]) + 1n === BigInt(to[1]);
              if (!developmentHead.test(head) && !adjacent) {
                core.setFailed(
                  `PRs to ${base} must originate from feature/*, bugfix/*, docs/*, ` +
                  `or exactly the preceding release/N; got ${head}`
                );
                return;
              }
            } else {
              core.setFailed(
                `Unsupported PR base ${base}; expected master or release/N`
              );
              return;
            }

            const issueNumbers = [
              ...new Set(
                [...body.matchAll(/#(\d+)/g)].map((match) => Number(match[1]))
              ),
            ];

            if (issueNumbers.length === 0) {
              core.setFailed(
                "PR description must reference an issue (for example: Fixes #123)"
              );
              return;
            }

            for (const issue_number of issueNumbers) {
              try {
                await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                });
                core.info(`Issue #${issue_number} exists`);
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`Referenced issue #${issue_number} does not exist`);
                  return;
                }
                throw error;
              }
            }

            core.info(`Accepted branch policy: ${head} -> ${base}`);

      # Required via the existing "Validate branch policy and issue link" job.
      # Unlike pull_request CI, the release PUSH job actually boots an Arch VM.
      - name: Checkout release promotion source
        if: github.base_ref == 'master'
        uses: actions/checkout@v7

      - name: Verify latest release and exact-SHA Arch acceptance
        if: github.base_ref == 'master'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/branch-forward.py verify-master --head "$HEAD_REF" --sha "$HEAD_SHA"
