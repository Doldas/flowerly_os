name: pr-validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: ['release/**']

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-policy:
    name: Validate branch policy and issue link
    if: >-
      startsWith(github.head_ref, 'feature/') ||
      startsWith(github.head_ref, 'bugfix/') ||
      startsWith(github.head_ref, 'docs/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata as data
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const head = pr.head.ref;
            const base = pr.base.ref;
            const body = pr.body || "";

            const developmentHead = /^(feature|bugfix|docs)\/.+/;
            const releaseBranch = /^release\/([1-9]\d*)$/;

            if (!releaseBranch.test(base)) {
              core.setFailed(`Unsupported PR base ${base}; expected release/N`);
              return;
            }
            if (!developmentHead.test(head)) {
              core.setFailed(
                `PRs to ${base} must originate from feature/*, bugfix/* or docs/*; got ${head}`
              );
              return;
            }

            const issueNumbers = [
              ...new Set(
                [...body.matchAll(/#(\d+)/g)].map((match) => Number(match[1]))
              ),
            ];

            if (issueNumbers.length === 0) {
              core.setFailed(
                "PR description must reference an issue (for example: Fixes #123)"
              );
              return;
            }

            for (const issue_number of issueNumbers) {
              try {
                await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                });
                core.info(`Issue #${issue_number} exists`);
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`Referenced issue #${issue_number} does not exist`);
                  return;
                }
                throw error;
              }
            }

            core.info(`Accepted branch policy: ${head} -> ${base}`);

