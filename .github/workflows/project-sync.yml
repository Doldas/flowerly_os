name: Sync issues and PRs to project

on:
  issues:
    types: [opened, reopened]
  # Same-repo branches only in this repository.
  pull_request:
    types: [opened, reopened, ready_for_review]
  schedule:
    # Daily field reconciliation; keeps Sprint/release views accurate.
    - cron: "23 3 * * *"
  # NOTE: workflow_dispatch intentionally lives in project-sync-manual.yml.
  # NOTE: no top-level `permissions:` block here. Empirical mini-workflow
  # probes on 2026-10-18 (15 variants, throwaway branches) showed GitHub
  # creates empty push-validation runs marked failed for some
  # permissions/trigger combinations, while {issues, pull_request,
  # schedule} without a permissions block produces none. If the default
  # GITHUB_TOKEN cannot write to the project, configure the
  # FLOWERLY_PROJECT_TOKEN secret (PAT with 'project' scope).

concurrency:
  group: project-sync-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Add opened issue or PR to Flowerly engineering roadmap
        if: github.event_name == 'issues' || github.event_name == 'pull_request'
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/Doldas/projects/7
          github-token: ${{ secrets.FLOWERLY_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@v7

      - name: Reconcile project fields
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.FLOWERLY_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-project.py

      # Keep non-matching events green instead of a run whose every step
      # was filtered out.
      - name: No action required for this event
        if: github.event_name != 'issues' && github.event_name != 'pull_request'
            && github.event_name != 'schedule'
        run: echo "event=${{ github.event_name }} needs no project sync"
