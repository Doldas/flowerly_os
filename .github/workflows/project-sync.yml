name: Sync issues and PRs to project

on:
  issues:
    types: [opened, reopened]
  # Same-repo branches only in this repository.
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [master]
  schedule:
    # Daily field reconciliation; keeps Sprint/release views accurate.
    - cron: "23 3 * * *"
  # NOTE: workflow_dispatch intentionally lives in project-sync-manual.yml.

# Least privilege (#187). GITHUB_TOKEN only reads: writing to the user-owned
# Project needs the FLOWERLY_PROJECT_TOKEN secret (PAT with 'project' scope),
# which the steps below prefer. An earlier note (2026-10-18 probes) avoided
# a permissions block because some combinations produced empty failed runs;
# this block was re-checked on the #187 PR push (security-alert-triage.md).
permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-sync-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Doldas/flowerly_os' && github.event.repository.default_branch == github.ref
    runs-on: ubuntu-latest
    steps:
      - name: Add opened issue or PR to Flowerly engineering roadmap
        if: github.event_name == 'issues' || github.event_name == 'pull_request'
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/Doldas/projects/7
          github-token: ${{ secrets.FLOWERLY_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reconcile project fields
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.FLOWERLY_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-project.py

      # Keep non-matching events green instead of a run whose every step
      # was filtered out.
      - name: No action required for this event
        if: github.event_name != 'issues' && github.event_name != 'pull_request'
            && github.event_name != 'schedule'
        run: echo "event=${{ github.event_name }} needs no project sync"
