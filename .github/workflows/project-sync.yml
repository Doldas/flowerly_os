name: Sync issues and PRs to project

on:
  issues:
    types: [opened, reopened]
  # Same-repo branches only in this repository; pull_request_target would
  # trigger empty push-validation runs that GitHub marks as failed.
  pull_request:
    types: [opened, reopened, ready_for_review]
  schedule:
    # Daily field reconciliation; keeps Sprint/release views accurate.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read
  projects: write

concurrency:
  group: project-sync-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Runs on same-repo pull requests only; posts an item link, no code.
      - name: Add opened issue or PR to Flowerly engineering roadmap
        if: github.event_name == 'issues' || github.event_name == 'pull_request'
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/Doldas/projects/7
          github-token: ${{ secrets.FLOWERLY_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Reconcile project fields
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.FLOWERLY_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-project.py

      # Keep non-matching events (for example push validations) green instead
      # of a run whose every step was filtered out.
      - name: No action required for this event
        if: github.event_name != 'issues' && github.event_name != 'pull_request'
            && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: echo "event=${{ github.event_name }} needs no project sync"
