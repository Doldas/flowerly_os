name: Sync issues and PRs to project

on:
  issues:
    types:
      - opened
      - reopened
      - transferred
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read
  projects: write

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add item to project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/Doldas/projects/7
          github-token: ${{ secrets.GITHUB_TOKEN }}
