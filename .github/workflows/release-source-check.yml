name: release-source-check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: read

jobs:
  check-source-branch:
    name: Verify PR originates from release/* branch
    runs-on: ubuntu-latest
    steps:
      - name: Check head branch pattern
        if: "!startsWith(github.head_ref, 'release/')"
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "::error::PRs to master must originate from a release/* branch (e.g., release/1, release/2)"
          printf 'Current head branch: %s\n' "$HEAD_REF"
          exit 1

      - name: Accept release branch
        if: startsWith(github.head_ref, 'release/')
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: printf 'PR originates from release branch %s\n' "$HEAD_REF"
