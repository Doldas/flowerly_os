name: Documentation Pages

on:
  push:
    branches:
      - master
      - "release/**"
    paths:
      - "web-docs/docs/**"
      - "web-docs/mkdocs.yml"
      - "web-docs/requirements-docs.txt"
      - "scripts/build-docs-site.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: web-docs/requirements-docs.txt

      # Shared builder installs pinned requirements in a disposable venv.
      - name: Build and verify Pages site
        run: bash ./scripts/build-docs-site.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The builder writes to ${GITHUB_WORKSPACE}/site, not web-docs/site.
          path: site

  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
