name: Documentation Pages

on:
  push:
    branches:
      - master
      - "release/**"
    paths:
      - "web-docs/docs/**"
      - "web-docs/mkdocs.yml"
      - "web-docs/requirements-docs.txt"
      - "scripts/build-docs-site.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: web-docs/requirements-docs.txt

      # Shared builder installs pinned requirements in a disposable venv.
      - name: Build and verify Pages site
        run: bash ./scripts/build-docs-site.sh

      # Release branches validate docs in CI but do not publish a Pages site.
      # A new Pages site must first be enabled under Settings > Pages using
      # Source: GitHub Actions. Alternatively a scoped bootstrap secret can
      # enable the site via configure-pages with an elevated token.
      - name: Verify Pages provisioning
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_TOKEN: ${{ secrets.PAGES_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "${code}" == "404" && -z "${BOOTSTRAP_TOKEN}" ]]; then
            echo "::error::GitHub Pages is not enabled. In repository Settings > Pages, set Build and deployment > Source to GitHub Actions. Alternatively configure PAGES_BOOTSTRAP_TOKEN with Pages write and repository administration write access."
            exit 1
          fi
          if [[ "${code}" != "200" && "${code}" != "404" ]]; then
            echo "::error::GitHub Pages status request failed: HTTP ${code}"
            exit 1
          fi

      - name: Setup Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
          token: ${{ secrets.PAGES_BOOTSTRAP_TOKEN || github.token }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          # The builder writes to ${GITHUB_WORKSPACE}/site, not web-docs/site.
          path: site

  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
