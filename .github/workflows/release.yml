name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  arch-kernel:
    name: Final Arch kernel validation
    runs-on: flowerly-runner
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install QEMU host dependencies
        shell: bash
        run: |
          set -euo pipefail

          required=(qemu-system-x86_64 qemu-img cloud-localds)
          missing=0
          for tool in "${required[@]}"; do
              command -v "$tool" >/dev/null 2>&1 || missing=1
          done

          if [[ ! -f /usr/share/OVMF/OVMF_CODE_4M.fd &&
                ! -f /usr/share/OVMF/OVMF_CODE.fd &&
                ! -f /usr/share/edk2/ovmf/OVMF_CODE.fd &&
                ! -f /usr/share/edk2/x64/OVMF_CODE.4m.fd ]]; then
              missing=1
          fi

          if [[ "$missing" -eq 1 ]]; then
              if ! command -v apt-get >/dev/null 2>&1; then
                  echo "The release runner is missing QEMU/cloud-init tools and has no apt-get." >&2
                  exit 1
              fi

              if [[ "${EUID}" -eq 0 ]]; then
                  apt-get update
                  apt-get install -y qemu-system-x86 qemu-utils ovmf cloud-image-utils openssh-client curl
              else
                  sudo apt-get update
                  sudo apt-get install -y qemu-system-x86 qemu-utils ovmf cloud-image-utils openssh-client curl
              fi
          fi

      - name: Verify tag inside a fully upgraded Arch VM
        env:
          FLOWERLY_TEST_REF: ${{ github.ref_name }}
          FLOWERLY_TEST_SHA: ${{ github.sha }}
          FLOWERLY_TEST_SLUG: release-tag
        shell: bash
        run: bash ./scripts/arch-kernel-vm-test.sh

      - name: Upload final Arch VM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: arch-kernel-release-${{ github.ref_name }}-${{ github.sha }}
          path: target/arch-kernel/release-tag/report/
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Release ${{ github.ref_name }}
    needs: arch-kernel
    runs-on: flowerly-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify
        run: just verify

      - name: Build release artifacts
        run: |
          just build
          cd target/release
          sha256sum agenticd flowd sessiond goald provenanced capabilityd generationd evolutiond agenticctl > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            target/release/agenticd
            target/release/flowd
            target/release/sessiond
            target/release/goald
            target/release/provenanced
            target/release/capabilityd
            target/release/generationd
            target/release/evolutiond
            target/release/agenticctl
            target/release/SHA256SUMS