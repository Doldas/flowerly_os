name: release-promotion-validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-promotion:
    name: Verify release promotion exact-SHA Arch acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release promotion source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify latest release and exact-SHA Arch acceptance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/branch-forward.py verify-master --head "$HEAD_REF" --sha "$HEAD_SHA"
