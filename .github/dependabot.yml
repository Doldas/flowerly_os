version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    # Integration branch: master only receives release/N promotions.
    target-branch: "release/2"
    schedule:
      interval: "weekly"
    groups:
      crates:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    # Integration branch: master only receives release/N promotions.
    target-branch: "release/2"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]